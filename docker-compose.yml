# =====================================================================================
# BiteStream :: docker-compose.yml
#
# Brings up both engines at the exact versions this project was built against, so every
# team member - and the grader - runs identical servers.
#
#   docker compose up -d
#   docker compose down          # stop, keep the data
#   docker compose down -v       # stop and DELETE the volumes (full reset)
#
# If you would rather run the engines natively, see README.md; nothing in the project
# depends on Docker.
# =====================================================================================
services:

  postgres:
    image: postgres:17
    container_name: bitestream-pg
    environment:
      POSTGRES_DB: bitestream
      POSTGRES_USER: bs
      POSTGRES_PASSWORD: bs
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_wal_size=4GB
      -c random_page_cost=1.1
      -c track_io_timing=on
    # random_page_cost defaults to 4.0, which models a spinning disk and pushes the
    # planner towards sequential scans. 1.1 reflects SSD-backed storage and is the
    # difference between an Index Only Scan and a Seq Scan in the Workflow 2 proof.
    # track_io_timing=on makes EXPLAIN (ANALYZE, BUFFERS) report real I/O timings.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bs -d bitestream"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    container_name: bitestream-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
